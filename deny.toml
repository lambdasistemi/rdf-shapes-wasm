# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/

# Evaluate the dependency graph for the native host triples plus the
# wasm target the artifact ships for, so target-specific dependencies
# are resolved the same way the real builds resolve them.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown",
]
all-features = true

[advisories]
yanked = "deny"
# Two transitive *unmaintained* advisories (not vulnerabilities, no
# unsound flag) reach us only through rudof's table-rendering chain
# (rudof_rdf -> tabled -> tabled_derive), with "no safe upgrade
# available". They are off the evaluation path entirely. Real
# vulnerabilities and yanked crates still fail the gate.
#   RUSTSEC-2024-0436  paste            (unmaintained)
#   RUSTSEC-2026-0173  proc-macro-error2 (unmaintained)
ignore = [
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0173",
]

[licenses]
# Exactly the licenses encountered in the oxigraph + rudof dependency
# trees (verified with `cargo deny check licenses`). Permissive only:
# no copyleft beyond MPL-2.0's weak per-file copyleft (oxsdatatypes /
# webpki-roots). Add only licenses actually encountered; an unused
# allowance would warn.
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path dependencies carry a version and are not
# real wildcards; exempt them so the gate flags only true wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
