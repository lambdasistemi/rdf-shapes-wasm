<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SHACL-in-wasm spike (issue #4)</title>
    <style>
      body { font: 14px system-ui, sans-serif; max-width: 60rem; margin: 2rem auto; }
      textarea { width: 100%; height: 12rem; font-family: monospace; }
      pre { background: #f4f4f4; padding: 1rem; overflow: auto; }
      .row { display: flex; gap: 1rem; }
      .row > div { flex: 1; }
    </style>
  </head>
  <body>
    <h1>SHACL Core validation in WebAssembly</h1>
    <p>
      Throwaway spike. Build the <code>--target web</code> bindings into
      <code>pkg/</code> (see README — swap <code>nodejs</code> for
      <code>web</code>), serve this directory over HTTP, and click Validate.
    </p>
    <div class="row">
      <div>
        <label>Data (Turtle)<textarea id="data"></textarea></label>
      </div>
      <div>
        <label>Shapes (Turtle)<textarea id="shapes"></textarea></label>
      </div>
    </div>
    <button id="run">Validate</button>
    <h2>Report</h2>
    <pre id="out">(load the module, then click Validate)</pre>

    <script type="module">
      import init, { validate } from "./pkg/shacl_spike.js";
      await init();
      document.getElementById("run").addEventListener("click", () => {
        const data = document.getElementById("data").value;
        const shapes = document.getElementById("shapes").value;
        const report = JSON.parse(validate(data, shapes));
        document.getElementById("out").textContent = JSON.stringify(report, null, 2);
      });
    </script>
  </body>
</html>
