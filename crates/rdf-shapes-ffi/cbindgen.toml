# cbindgen configuration for the C header generated over the
# `extern "C"` surface of `rdf-shapes-ffi`. The header is produced
# reproducibly in the Nix `ffi-lib` derivation by `pkgs.cbindgen`
# (no build.rs, no network), so it can never drift from the symbols.
language = "C"
header = "/* Generated by cbindgen from rdf-shapes-ffi. Do not edit. */"
include_guard = "RDF_SHAPES_H"
pragma_once = true
autogen_warning = "/* This file is auto-generated; edits will be overwritten. */"
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "type"

[export]
prefix = ""

[parse]
parse_deps = false
