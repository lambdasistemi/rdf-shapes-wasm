name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-gate:
    name: Build Gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
          path: checkout
      # Read-only when CACHIX_AUTH_TOKEN is unset; never gates CI on a
      # cache push.
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Warm the Nix store
        working-directory: checkout
        run: >-
          nix build --quiet
          .#cli
          .#lib
          .#wasm-pkg
          .#ffi-lib
          .#checks.x86_64-linux.clippy
          .#checks.x86_64-linux.nextest
          .#checks.x86_64-linux.fmt
          .#checks.x86_64-linux.deny
          .#checks.x86_64-linux.doc
          .#checks.x86_64-linux.conformance

  test:
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
          path: checkout
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Unit tests (cargo-nextest)
        working-directory: checkout
        run: nix build --quiet .#checks.x86_64-linux.nextest

  clippy:
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
          path: checkout
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Clippy (-D warnings)
        working-directory: checkout
        run: nix build --quiet .#checks.x86_64-linux.clippy

  fmt-check:
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
          path: checkout
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: rustfmt check
        working-directory: checkout
        run: nix build --quiet .#checks.x86_64-linux.fmt

  wasm-build:
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
          path: checkout
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build reproducible wasm bundle
        working-directory: checkout
        run: nix build --quiet .#wasm-pkg

  ffi-build:
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
          path: checkout
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build native C-ABI shared library
        working-directory: checkout
        run: nix build --quiet .#ffi-lib

  conformance:
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false
          path: checkout
      - uses: cachix/cachix-action@v17
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Conformance and Jena differential
        working-directory: checkout
        run: nix build --quiet .#checks.x86_64-linux.conformance
